services:
  postgres:
    # container_name намеренно не задан: жёсткое имя занимает его глобально в Docker,
    # и второй чекаут проекта или переименованная папка упираются в «container name
    # already in use», хотя порт свободен. Compose сам назовёт контейнер по имени
    # проекта, а все команды обращаются к сервису postgres, не к имени контейнера.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - pnewmo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pnewmo-pgdata:
